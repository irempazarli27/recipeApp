[build]
  base    = "."
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# /api/* isteklerini Render backend'ine ilet
[[redirects]]
  from   = "/api/*"
  to     = "https://recipeapp-jg8d.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA: tüm diğer istekleri index.html'e yönlendir
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
